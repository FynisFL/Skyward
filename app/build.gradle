plugins {
    id "com.android.application"
}

android {
    namespace "com.fynisfl.skywardsalvage"
    compileSdk 35

    defaultConfig {
        applicationId "com.fynisfl.skywardsalvage"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}
