name: Skyward quality validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "tools/qa/**"
      - "README.md"
      - "PHASE_*.md"
      - ".github/workflows/quality-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Source, deterministic and adaptive-rendering tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run deterministic RNG, event and replay tests
        run: node tools/qa/phase7.test.mjs
      - name: Run adaptive-rendering tests
        run: node tools/qa/phase8.test.mjs
      - name: Run runtime benchmark tests
        run: node tools/qa/phase9.test.mjs
      - name: Run Replay v2 cross-platform tests
        run: node tools/qa/phase10.test.mjs
      - name: Run repository QA validator
        run: node tools/qa/validate.mjs
